<h3>Work Experience</h3>
<ul *ngFor="let job of workExperience">
    <li>
        {{ job.startDate }} - {{ job.endDate }} <i> {{ job.location }} </i> <br>
        <b> {{ job.position }} </b> <br>
        {{ job.company }} <br>
        <div class="accomplishment-capsules">
            <span class="blue-capsule" *ngFor="let acc of job.acomplishmentsArray">{{ acc }}</span>
        </div>
    </li>
</ul>
